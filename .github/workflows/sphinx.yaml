name: sphinx

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Setting up the environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # - name: Install Poetry
      #   run: pip install poetry

      - name: Install Sphinx
        run: pip install sphinx

      - name: Install the package
        run: pip install ".[doc]"

      # Building (docs/index.md includes the README; the examples in
      # docs/intro.md are rendered with `make docs/intro.md`)
      - name: Build HTML using Sphinx
        run: sphinx-build -M html docs docs/build/

      # Upload
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: docs/build/html/

  post-page-artifact:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Post comment preview
        uses: CDCgov/cfa-actions/post-artifact@v1.0.0
        with:
          artifact-name: github-pages
          gh-token: ${{ secrets.GITHUB_TOKEN}}
          message: "Thanks for your contribution, ${{ github.actor }}; your `{ artifact-name }` is ready for download [here]({ artifact-url })."

  deploy:
    # Deploy to the github-pages environment
    # but not on PRs
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build

    # Specify runner + deployment step
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
